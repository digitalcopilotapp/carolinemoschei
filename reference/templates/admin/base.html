<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — Caroline Moschei</title>
  <style>
    :root { --bg: #0f0f0f; --card: #1a1a1a; --border: #2a2a2a; --caramel: #C8956C; --gold: #D4A574; --bone: #F0EBE3; --dim: #7A756F; --danger: #c0392b; --success: #27ae60; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--bone); line-height: 1.6; }
    a { color: var(--caramel); text-decoration: none; }
    a:hover { color: var(--gold); }
    .container { max-width: 900px; margin: 0 auto; padding: 24px; }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--border); }
    .nav__brand { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em; color: var(--caramel); }
    .nav__links { display: flex; gap: 20px; font-size: 0.78rem; }
    .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; font-size: 0.78rem; font-weight: 500; border: none; cursor: pointer; text-align: center; }
    .btn--primary { background: var(--caramel); color: #080808; }
    .btn--primary:hover { background: var(--gold); color: #080808; }
    .btn--danger { background: var(--danger); color: white; }
    .btn--small { padding: 6px 14px; font-size: 0.72rem; }
    .btn--outline { background: none; border: 1px solid var(--border); color: var(--bone); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 16px; }
    .stat { text-align: center; }
    .stat__value { font-size: 2rem; font-weight: 300; color: var(--caramel); }
    .stat__label { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 500; color: var(--dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--bone); font-size: 0.85rem; font-family: inherit; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--caramel); }
    .form-row { display: flex; gap: 12px; }
    .form-row > * { flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { text-align: left; padding: 10px; color: var(--dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid var(--border); }
    td { padding: 10px; border-bottom: 1px solid var(--border); }
    .flash { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 0.82rem; }
    .flash--success { background: rgba(39,174,96,0.15); color: var(--success); border: 1px solid rgba(39,174,96,0.3); }
    .flash--error { background: rgba(192,57,43,0.15); color: var(--danger); border: 1px solid rgba(192,57,43,0.3); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 600; }
    .badge--active { background: rgba(39,174,96,0.2); color: var(--success); }
    .badge--inactive { background: rgba(122,117,111,0.2); color: var(--dim); }
    .actions { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="nav__brand">CM Admin</span>
    <div class="nav__links">
      <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('admin.leads') }}">Leads</a>
      <a href="/" target="_blank">Ver Site</a>
      <a href="{{ url_for('auth.logout') }}">Sair</a>
    </div>
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash--{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>

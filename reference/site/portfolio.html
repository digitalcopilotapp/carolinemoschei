    /* Portfolio page overrides */
    .portfolio-header {
      text-align: center;
      padding: 48px 24px 8px;
      max-width: var(--max-w);
      width: 100%;
    }

    .portfolio-header__back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      transition: color 0.3s, transform 0.3s var(--ease);
      margin-bottom: 20px;
      min-height: 44px;
      padding: 12px 16px;
    }

    .portfolio-header__back:hover {
      color: var(--caramel);
      transform: translateX(-4px);
    }

    .portfolio-header__back svg {
      width: 18px;
      height: 18px;
    }

    .portfolio-header h1 {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 1.6rem;
      letter-spacing: 0.06em;
      color: var(--bone);
    }

    .portfolio-header p {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 6px;
      letter-spacing: 0.08em;
    }

    /* Safe area padding */
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Wider gallery on portfolio page */
    .gallery {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .gallery-item {
      aspect-ratio: 3 / 4;
    }

    /* Focus point adjustments per category */
    .gallery-item img {
      object-position: center 20%;
    }

    .gallery-item[data-focus="center"] img { object-position: center center; }
    .gallery-item[data-focus="top"] img { object-position: center 15%; }
    .gallery-item[data-focus="face"] img { object-position: center 25%; }

    @media (min-width: 520px) {
      :root { --max-w: 600px; }
      .gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }

  <script>
  // === TABS ===
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.tab-panel');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.tab;
      panels.forEach(p => {
        if (p.id === 'tab-' + target) {
          p.classList.add('active');
        } else {
          p.classList.remove('active');
        }
      });
    });
  });

  // === LIGHTBOX ===
  const lb = document.querySelector('.lightbox');
  const lbImg = lb.querySelector('.lb-img');
  let current = 0;

  function activeItems() {
    const active = document.querySelector('.tab-panel.active');
    return active ? Array.from(active.querySelectorAll('.gallery-item')) : [];
  }

  function openLb(idx) {
    const items = activeItems();
    current = idx;
    if (!items[idx]) return;
    lbImg.src = items[idx].querySelector('img').src;
    lbImg.alt = items[idx].querySelector('img').alt;
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeLb() {
    lb.hidden = true;
    lbImg.src = '';
    document.body.style.overflow = '';
  }

  function nav(dir) {
    const items = activeItems();
    current = (current + dir + items.length) % items.length;
    openLb(current);
  }

  document.addEventListener('click', e => {
    const item = e.target.closest('.gallery-item');
    if (item) {
      const items = activeItems();
      const idx = items.indexOf(item);
      if (idx >= 0) openLb(idx);
    }
  });

  lb.querySelector('.lb-close').addEventListener('click', closeLb);
  lb.querySelector('.lb-prev').addEventListener('click', () => nav(-1));
  lb.querySelector('.lb-next').addEventListener('click', () => nav(1));
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => {
    if (lb.hidden) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') nav(-1);
    if (e.key === 'ArrowRight') nav(1);
  });

  // === SWIPE SUPPORT ===
  let touchStartX = 0;
  let touchStartY = 0;

  lb.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  lb.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    // Only trigger if horizontal swipe is dominant and > 50px
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) nav(1);  // swipe left = next
      else nav(-1);        // swipe right = prev
    }
  }, { passive: true });
  </script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orçamentos | Ensaios, Casamentos e Campanhas | Caroline Moschei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/site-theme.css">
  <script defer src="../scripts/site-interactions.js"></script>
</head>
<body class="page page-orcamentos">
  <div data-site-header></div>
  <main>
    <section class="orcamentos-hero">
      <div class="orcamentos-hero__inner">
        <article class="orcamentos-card hero-glass smoke-reveal is-visible">
          <header class="orcamentos-card__head">
            <span class="orcamentos-card__eyebrow">Orçamentos</span>
            <h1 class="orcamentos-card__title">Ensaios, casamentos e campanhas</h1>
            <p class="orcamentos-card__lead">
              Clique abaixo para falar com o time de atendimento sobre o seu ensaio, casamento ou campanha.
            </p>
          </header>
          <section class="orcamentos-card__body">
            <p class="orcamentos-card__note" data-orcamentos-info>
              Vamos registrar com segurança os dados da sua campanha e, em seguida, abrir o WhatsApp do estúdio.
            </p>
          </section>
          <div class="orcamentos-card__actions">
            <button type="button" class="hero-cta-primary orcamentos-card__cta" data-orcamentos-cta>
              Falar com o time de atendimento
            </button>
            <p class="orcamentos-card__status" data-orcamentos-status aria-live="polite"></p>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>

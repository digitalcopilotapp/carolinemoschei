services:
  webhook:
    build: .
    container_name: hotmart-webhook
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - webhook-network

networks:
  webhook-network:
    driver: bridge

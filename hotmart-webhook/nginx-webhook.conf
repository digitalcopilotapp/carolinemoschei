# ============================================
# Nginx config para webhook.carolinemoschei.site
# ============================================
# Se estiver usando CyberPanel, adicione este virtual host
# pelo painel ou coloque em /etc/nginx/conf.d/webhook.conf
#
# Se preferir configurar pelo CyberPanel:
# 1. Criar website: webhook.carolinemoschei.site
# 2. Ativar SSL (Let's Encrypt)
# 3. Adicionar proxy reverso para localhost:3001

server {
    listen 80;
    server_name webhook.carolinemoschei.site;

    # Redirecionar para HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name webhook.carolinemoschei.site;

    # SSL - ajustar caminhos conforme seu CyberPanel
    # ssl_certificate /etc/letsencrypt/live/webhook.carolinemoschei.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/webhook.carolinemoschei.site/privkey.pem;

    # Proxy para o container Docker
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Logs
    access_log /var/log/nginx/webhook-access.log;
    error_log /var/log/nginx/webhook-error.log;
}
